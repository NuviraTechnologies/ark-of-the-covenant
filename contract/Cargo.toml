[package]
name = "ark-vault"
version = "0.1.0"
edition = "2021"
description = "Ark of the Covenant — a NEAR vault an AI agent can spend from but cannot drain. Policy gate enforced inside the release path; purpose-bound releases; sealed secrets that are usable but never readable."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
# Unit-test builds of near-sdk need this feature (mocked blockchain env);
# the wasm contract build does not enable it.
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
debug = false
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
